# Kitty Terminal - Gold to Rose Theme

# Font
font_family      FiraCode Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        12.0
enable_ligatures yes

# Keybinds
map shift+enter send_text all \e\r

# Window — liquid metal: let blur do the heavy lifting
background_opacity 0.82
dynamic_background_opacity yes
window_padding_width 12
confirm_os_window_close 0

# Cursor
cursor                  #e8a854
cursor_text_color       #1e1c23
cursor_shape            beam
cursor_blink_interval   0.5

# Selection
selection_foreground    #1e1c23
selection_background    #e8a854

# URL
url_color               #6b8cae
url_style               curly

# Window borders
active_border_color     #e8a854
inactive_border_color   #6b8cae
bell_border_color       #e875a1

# Tab bar
tab_bar_style           powerline
tab_powerline_style     slanted
active_tab_foreground   #1e1c23
active_tab_background   #e8a854
inactive_tab_foreground #e8e0d6
inactive_tab_background #2a2630
tab_bar_background      #1e1c23

# Colors - Gold to Rose Theme
foreground              #e8e0d6
background              #1e1c23

# Black
color0                  #2a2630
color8                  #4a4655

# Red
color1                  #e85a5a
color9                  #f07878

# Green
color2                  #a8c686
color10                 #b8d696

# Yellow (Gold)
color3                  #e8a854
color11                 #f5b864

# Blue (Steel)
color4                  #6b8cae
color12                 #8ba6c6

# Magenta (Rose)
color5                  #e875a1
color13                 #f095b5

# Cyan
color6                  #7eb8c4
color14                 #9ed0dc

# White
color7                  #c8c0b6
color15                 #e8e0d6
