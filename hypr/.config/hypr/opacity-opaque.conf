# Opaque mode — solid everything, full readability

# Kitty terminal
windowrule {
    name = kitty-opacity
    match:class = ^(kitty)$
    opacity = 1.0 1.0
}

# Kitty floating
windowrule {
    name = kitty-float-glass
    match:class = ^(kitty)$
    match:float = true
    opacity = 1.0 1.0
}

# Claude Code
windowrule {
    name = claude-code-class
    match:class = ^(claude-code)$
    opacity = 1.0 1.0
}
windowrule {
    name = claude-code-title
    match:title = ^(Claude Code.*)$
    opacity = 1.0 1.0
}
