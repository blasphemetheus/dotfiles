# Transparent mode — see wallpaper through everything

# Kitty terminal — tiled
windowrule {
    name = kitty-opacity
    match:class = ^(kitty)$
    opacity = 0.8 0.7
}

# Kitty floating — extra glass
windowrule {
    name = kitty-float-glass
    match:class = ^(kitty)$
    match:float = true
    opacity = 0.45 0.35
}

# Claude Code
windowrule {
    name = claude-code-class
    match:class = ^(claude-code)$
    opacity = 0.85 0.75
}
windowrule {
    name = claude-code-title
    match:title = ^(Claude Code.*)$
    opacity = 0.85 0.75
}

# Browsers
windowrule {
    name = firefox-opacity
    match:class = ^(firefox)$
    opacity = 0.75 0.6
}
windowrule {
    name = chromium-opacity
    match:class = ^(chromium-browser|google-chrome|brave-browser|vivaldi)$
    opacity = 0.75 0.6
}
