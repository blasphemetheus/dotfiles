
# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# EDIT THIS CONFIG ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hypr.land/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


# (Hyprland plugins — all blocked on 0.54, configs ready for when nixpkgs updates)

################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
# highrr = highest refresh rate mode (curved ASUS VG27V: 165Hz over HDMI).
# vrr,1 is aspirational: this monitor is HDMI/VGA-only and NVIDIA doesn't do
# FreeSync-over-HDMI, so VRR stays off; the slippi-tearing windowrule is the
# low-latency path instead. Harmless to leave on for a future VRR display.
monitor=,highrr,auto,1,vrr,1
# AOpen 16PM1Q (portable, via DP→mini-HDMI + forced EDID): highrr would pick
# 800x600@60.32 over 1920x1080@60.00, so pin the native mode explicitly.
monitor = desc:AOP 16PM1Q J 1523100C95V01, 1920x1080@60, auto, 1



###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = dolphin
$menu = pkill rofi || rofi -show drun


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# Export Wayland env to systemd/dbus (needed for xdg-desktop-portal, screen sharing, etc.)
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP HYPRLAND_INSTANCE_SIGNATURE
# Polkit agent (graphical-session.target doesn't activate under greetd, so start directly)
exec-once = systemctl --user start polkit-gnome-agent.service

exec-once = $terminal
exec-once = nm-applet &
exec-once = waybar & firefox
# exec-once = hyprpanel  # Uncomment to try alongside/instead of waybar
# exec-once = /home/dori/vocalinux/start-vocalinux-idle.sh  # disabled — wrong path
exec-once = wl-paste --watch cliphist store  # Clipboard history daemon
exec-once = mako  # Notification daemon
exec-once = swww-daemon  # Animated wallpaper daemon
exec-once = bash -c 'sleep 5 && while true; do ~/.config/hypr/scripts/wallpaper.sh random; sleep 300; done'  # Cycle random wallpaper every 5 min
exec-once = cd ~/.config/ags && ags run  # AGS Dashboard
exec-once = ~/.config/hypr/scripts/battery-monitor.sh  # Battery low warning
exec-once = hypridle  # Auto lock + suspend on idle
exec-once = hyprshade auto  # Blue light filter on schedule (see hyprshade.toml)
exec-once = pyprland  # Scratchpad daemon
exec-once = ~/.config/hypr/scripts/wallpaper-workspace.sh  # Per-workspace wallpapers
# hypr-dynamic-cursors — BLOCKED: plugin doesn't build on Hyprland 0.54, wait for nixpkgs update
exec-once = rm -f /tmp/wobpipe && mkfifo /tmp/wobpipe && tail -f /tmp/wobpipe | wob

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,24
env = PATH,$HOME/.local/bin:$PATH

# NVIDIA Wayland — required for proper GPU rendering
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct


###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 20

    border_size = 3

    # Gold to Rose gradient border - elegant shifting colors
    col.active_border = rgba(f5a623ff) rgba(e8a854ff) rgba(d4848cff) rgba(e875a1ff) 45deg
    col.inactive_border = rgba(6b8caebb)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    # Enabled for Slippi Dolphin only (see slippi-tearing windowrule): no VRR
    # over HDMI on NVIDIA, so immediate presentation is the low-latency option.
    allow_tearing = true

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 12
    rounding_power = 2

    # Dim inactive windows (disabled - using border colors for focus indication)
    dim_inactive = false
    dim_strength = 0.15

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(e8a85450)
        color_inactive = rgba(00000000)
        offset = 0 0
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    # Liquid metal blur — heavy blur for deep transparency
    blur {
        enabled = true
        size = 4
        passes = 1
        new_optimizations = true
        xray = false
        noise = 0.01
        contrast = 1.1
        brightness = 0.95
        vibrancy = 0.3
        vibrancy_darkness = 0.3
        popups = true
        special = true
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Curves
    bezier = linear, 0, 0, 1, 1
    bezier = quick, 0.15, 0, 0.1, 1

    # Snappy — fast start, clean deceleration
    bezier = snappy, 0.2, 1.0, 0.3, 1.0

    # Overshot — slight overshoot then settle
    bezier = overshot, 0.05, 0.9, 0.1, 1.05

    # Pop — bouncy entrance, lands with energy
    bezier = pop, 0.1, 0.8, 0.2, 1.15

    # Smooth exit — quick out, no lingering
    bezier = smoothOut, 0.4, 0, 0.2, 1

    # Elastic — springy, playful
    bezier = elastic, 0.2, 1.0, 0.3, 1.2

    # Windows — snappy pop-in, quick shrink-out
    animation = windowsIn, 1, 3, pop, popin 60%
    animation = windowsOut, 1, 2, smoothOut, popin 60%
    animation = windowsMove, 1, 3, overshot

    # Fading — fast, barely noticeable
    animation = fadeIn, 1, 2, snappy
    animation = fadeOut, 1, 2, smoothOut
    animation = fade, 1, 3, quick

    # Border — slow ambient color shift
    animation = border, 1, 10, default
    animation = borderangle, 1, 300, linear, loop

    # Layers (waybar, rofi, notifications)
    animation = layersIn, 1, 2, pop, slide
    animation = layersOut, 1, 2, smoothOut, slide
    animation = fadeLayersIn, 1, 2, snappy
    animation = fadeLayersOut, 1, 2, smoothOut

    # Workspaces — fast slide with slight overshot
    animation = workspaces, 1, 3, overshot, slide
    animation = specialWorkspace, 1, 3, pop, slidevert
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(

    # Window swallowing — terminal hides when it spawns a GUI app, reappears when app closes
    enable_swallow = true
    swallow_regex = ^(kitty)$
    # Apprun / Slippi / Dolphin / Melee = Slippi Dolphin (melee bot) — must not
    # swallow the Claude Code terminal. Matched broadly (class match alone
    # didn't take; cover titles too).
    swallow_exception_regex = ^(wev|wl-clipboard|Apprun)$|[Ss]lippi|[Dd]olphin|Melee
}

# Window grouping (tab windows together)
group {
    col.border_active = rgba(f5a623ff) rgba(e875a1ff) 45deg
    col.border_inactive = rgba(6b8cae88)

    groupbar {
        enabled = true
        font_family = FiraCode Nerd Font
        font_size = 10
        height = 18
        col.active = rgba(f5a623dd)
        col.inactive = rgba(1e1c23cc)
        text_color = rgba(e8e0d6ff)
        rounding = 6
        gaps_in = 3
        gaps_out = 3
    }
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
# device[epic-mouse-v1] {
#     sensitivity = -0.5
# }


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, escape, exec, wlogout -b 4
bind = $mainMod SHIFT CTRL, M, exit,  # emergency exit (no menu)
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, A, exec, kitty --class claude-code --title "Claude Code" -e claude
bind = , XF86Assistant, exec, kitty --class claude-code --title "Claude Code" -e claude
bind = $mainMod, T, exec, kitty -e btop
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle

# Screenshot area to clipboard + save
bind = , F9, exec, grim -g "$(slurp)" - | tee ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png | wl-copy
# Screenshot with annotation (draw arrows, text, highlights before saving)
bind = SHIFT, F9, exec, grim -g "$(slurp)" - | satty --filename - --output-filename ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png --copy-command wl-copy

# Color picker - click anywhere to copy hex color
bind = $mainMod SHIFT, C, exec, hyprpicker -a

# Clipboard history
bind = , F10, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# Emoji picker
bind = $mainMod, period, exec, rofimoji --action type --typer wtype

# Toggle fullscreen
bind = , F11, fullscreen, 0
bind = $mainMod, F, fullscreen, 0

# AGS dashboard (Super+D)
bind = $mainMod, D, exec, ags toggle dashboard

# Dictation (hyprwhspr-rs): tap F12 to toggle, hold Super+Space for push-to-talk.
# The daemon's evdev listener handles the keys itself (configured in
# ~/.config/hyprwhspr-rs/config.jsonc — v0.3.23 has no CLI control). These
# binds consume the keys from apps (F12 = devtools in Firefox) and run the
# notification script, which reports what the daemon actually did.
bind = , F12, exec, ~/.config/hypr/scripts/dictation.sh
bind = $mainMod, SPACE, exec, ~/.config/hypr/scripts/dictation.sh
bindr = $mainMod, SPACE, exec, ~/.config/hypr/scripts/dictation.sh

# Screenshot full screen
bind = , Print, exec, grim ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png && wl-copy < ~/Pictures/Screenshots/$(ls -t ~/Pictures/Screenshots | head -1)

# Screen recording toggle (Super+Shift+V to start, again to stop)
bind = $mainMod SHIFT, V, exec, pkill wf-recorder || wf-recorder -g "$(slurp)" -f ~/Videos/recording_$(date +%Y%m%d_%H%M%S).mp4

# Reload Hyprland config
bind = $mainMod SHIFT, R, exec, hyprctl reload && notify-send "Hyprland" "Config reloaded"

# Toggle idle/sleep (hypridle) - kills or restarts the daemon
bind = $mainMod, F5, exec, pkill hypridle && notify-send "Hypridle" "Sleep disabled - staying awake" || { hypridle & notify-send "Hypridle" "Sleep re-enabled"; }

# Lock screen
bind = $mainMod, L, exec, hyprlock

# Retrain wedged HDMI link (curved ASUS "no signal" while GPU is driving it)
bind = $mainMod SHIFT, H, exec, ~/.config/hypr/scripts/hdmi-retrain.sh

# Do Not Disturb toggle
bind = $mainMod SHIFT, D, exec, ~/.config/hypr/scripts/dnd-toggle.sh
bind = $mainMod SHIFT, O, exec, ~/.config/hypr/scripts/opacity-toggle.sh

# Window grouping/tabbing (Super+G to group, Super+Tab to cycle tabs)
bind = $mainMod, G, togglegroup,
bind = $mainMod, Tab, changegroupactive, f
bind = $mainMod SHIFT, Tab, changegroupactive, b
bind = $mainMod CTRL, G, moveoutofgroup,

# Cycle through windows (alt-tab style)
bind = ALT, Tab, cyclenext,
bind = ALT SHIFT, Tab, cyclenext, prev

# Falco shine cursor toggle
bind = ALT, S, exec, ~/.config/hypr/scripts/shine-toggle.sh

# Center floating window
bind = $mainMod SHIFT, space, centerwindow,

# Pin window (visible on all workspaces)
bind = $mainMod SHIFT, P, pin,

# Move windows with keyboard
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Resize windows with keyboard (resize mode)
bind = $mainMod CTRL, left, resizeactive, -50 0
bind = $mainMod CTRL, right, resizeactive, 50 0
bind = $mainMod CTRL, up, resizeactive, 0 -50
bind = $mainMod CTRL, down, resizeactive, 0 50

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scratchpad
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Pyprland scratchpads
bind = $mainMod, grave, exec, pypr toggle term
bind = $mainMod, X, exec, pypr toggle volume
bind = $mainMod SHIFT, X, exec, pypr toggle music
bind = $mainMod, Y, exec, pypr toggle files
bind = $mainMod, equal, exec, pypr zoom

# Notification history (makoctl)
bind = $mainMod, N, exec, makoctl restore
# Searchable notification history (rofi over the persistent log)
bind = $mainMod SHIFT, N, exec, notification-picker

# Wallpaper controls
bind = $mainMod, W, exec, ~/.config/hypr/scripts/wallpaper.sh picker
bind = $mainMod SHIFT, W, exec, ~/.config/hypr/scripts/wallpaper.sh random

# Browser
bind = $mainMod, B, exec, firefox

# Power profile toggle (Super+F6 to cycle, Super+Shift+F6 for rofi picker)
bind = $mainMod, F6, exec, ~/.config/hypr/scripts/power-profile.sh toggle
bind = $mainMod SHIFT, F6, exec, ~/.config/hypr/scripts/power-profile.sh rofi

# Hyprshade screen effects
bind = $mainMod SHIFT, N, exec, hyprshade toggle blue-light-filter
bind = $mainMod CTRL, N, exec, hyprshade off

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Volume — Super+Up/Down, mute with Super+M
bindel = $mainMod, Up, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ && wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{printf "%d\n", $2*100}' > /tmp/wobpipe
bindel = $mainMod, Down, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{printf "%d\n", $2*100}' > /tmp/wobpipe
bind = $mainMod, M, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{printf "%d\n", $2*100}' > /tmp/wobpipe
bind = $mainMod CTRL, M, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle

# Laptop multimedia keys (if available)
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+ && wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{printf "%d\n", $2*100}' > /tmp/wobpipe
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%- && wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{printf "%d\n", $2*100}' > /tmp/wobpipe
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle && wpctl get-volume @DEFAULT_AUDIO_SINK@ | awk '{printf "%d\n", $2*100}' > /tmp/wobpipe
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+ && brightnessctl -m | awk -F, '{print substr($4, 0, length($4)-1)}' > /tmp/wobpipe
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%- && brightnessctl -m | awk -F, '{print substr($4, 0, length($4)-1)}' > /tmp/wobpipe

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Keyboard mouse control
bind = $mainMod, semicolon, exec, wl-kbptr

# Walker launcher (Super+D), rofi stays on Super+R
bind = SUPER, D, exec, walker

# (hyprexpo + hyprspace disabled — plugins don't build on 0.54 yet)

# Session save/restore
bind = $mainMod CTRL, S, exec, ~/.config/hypr/scripts/session-picker.sh save
bind = $mainMod CTRL, R, exec, ~/.config/hypr/scripts/session-picker.sh restore

# Show keybinds cheatsheet (Super+Shift+?)
bind = $mainMod SHIFT, slash, exec, ~/.config/hypr/scripts/show-keybinds.sh

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Melee: present Slippi frames immediately (tear) instead of waiting for the
# next 165Hz refresh tick. Only affects these window classes.
windowrule {
    name = slippi-tearing
    match:class = ^(Slippi Dolphin|dolphin-emu)$
    immediate = true
}

# Ignore maximize requests from apps
windowrule {
    name = suppress-maximize
    match:class = .*
    suppress_event = maximize
}

# Fix some dragging issues with XWayland
windowrule {
    name = fix-xwayland-drag
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

# my stuff
windowrule {
    name = code-workspace
    match:class = ^(code)$
    workspace = 3
}

# Slippi Dolphin (melee bot sessions) — send to workspace 9 without stealing
# the current workspace (launched from scripts it was tiling over the
# terminal). Switch to ws 9 to watch the bot.
# Float: Dolphin opens unmapped on the hidden workspace and misses resize
# events, so tiling left the game rendering at its original 640x528 in the
# corner of a large black window. Floating at native size avoids any hidden
# resize; resize/fullscreen it manually while visible (live resizes work).
# NOT silent (hidden-workspace geometry changes desync Dolphin's GL
# framebuffer — game renders 640x528 in a corner), and NO size rule (even a
# visible at-map resize races Dolphin's GL init). Native floating window;
# toggle fullscreen to enlarge — that resize recovers cleanly when mapped.
windowrule {
    name = slippi-dolphin-workspace
    match:class = ^(Apprun)$
    workspace = 9
    float = true
    center = true
}

# rwing (Super Smash Bros. Melee replay viewer, closed-source Patreon binary).
# rwing is a winit(X11-only) + wgpu/vello app, so it runs under XWayland. winit
# mis-reads the window geometry at map time and needs ONE configure event (move,
# resize, or float-toggle) to re-sync — which is why Super+Arrow / Super+V fix
# the click-coordinate offset by hand. The fix here is to let it map at winit's
# OWN geometry and NEVER reconfigure it: plain float, and per the Dolphin rule
# above, NO size and NO move (either fires a geometry change mid-startup that
# races winit's init and re-triggers the offset). Match any version — the version
# string is baked into the class (e.g. rwing-linux-a2.3). Drag it where you want.
windowrule {
    name = rwing-float
    match:class = ^(rwing|rwing-linux-.*)$
    float = true
}

###############################
### FREAKY WINDOW RULES ###
###############################

# Pyprland scratchpad windows
windowrule {
    name = dropterm-float
    match:class = ^(kitty-dropterm)$
    animation = slidevert
    opacity = 0.85
}
windowrule {
    name = cava-float
    match:class = ^(kitty-cava)$
    animation = slide
    opacity = 0.85
}
windowrule {
    name = yazi-float
    match:class = ^(kitty-yazi)$
    animation = slide
    opacity = 0.9
}


# Opacity rules — swapped by Super+Shift+O toggle
source = $HOME/.config/hypr/opacity-active.conf

# Firefox picture-in-picture
windowrule {
    name = firefox-pip
    match:title = ^(Picture-in-Picture)$
    float = on
    pin = on
    size = 400 225
}

# File picker dialogs
windowrule {
    name = file-picker-float
    match:title = ^(Open File)$|^(Save File)$|^(Open Folder)$
    float = on
}

# Make wofi/rofi popups pretty
windowrule {
    name = launcher-float
    match:class = ^(wofi)$|^(rofi)$
    animation = slide
}

# Wlogout power menu - fullscreen overlay
windowrule {
    name = wlogout-float
    match:class = ^(wlogout)$
    float = on
    fullscreen = true
}

##############################
### LAYER RULES (blur) ###
##############################

# Liquid metal — blur behind waybar, rofi, notifications
layerrule {
    name = blur-waybar
    match:namespace = waybar
    blur = false
}
layerrule {
    name = blur-rofi
    match:namespace = rofi
