
# #######################################################################################
# AUTOGENERATED HYPRLAND CONFIG.
# EDIT THIS CONFIG ACCORDING TO THE WIKI INSTRUCTIONS.
# #######################################################################################

# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hypr.land/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf


################
### MONITORS ###
################

# See https://wiki.hypr.land/Configuring/Monitors/
monitor=,preferred,auto,1



###################
### MY PROGRAMS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = dolphin
$menu = pkill rofi || rofi -show drun


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# Export Wayland env to systemd/dbus (needed for xdg-desktop-portal, screen sharing, etc.)
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
# Polkit agent (graphical-session.target doesn't activate under greetd, so start directly)
exec-once = systemctl --user start polkit-gnome-agent.service

exec-once = $terminal
exec-once = nm-applet &
exec-once = waybar & firefox
# exec-once = /home/dori/vocalinux/start-vocalinux-idle.sh  # disabled — wrong path
exec-once = wl-paste --watch cliphist store  # Clipboard history daemon
exec-once = mako  # Notification daemon
exec-once = swww-daemon  # Animated wallpaper daemon
exec-once = bash -c 'sleep 5 && ~/.config/hypr/scripts/wallpaper.sh random'  # Set random wallpaper on login
exec-once = cd ~/.config/ags && ags run  # AGS Dashboard
exec-once = ~/.config/hypr/scripts/battery-monitor.sh  # Battery low warning
exec-once = hypridle  # Auto lock + suspend on idle

#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hypr.land/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = XCURSOR_THEME,Bibata-Modern-Classic
env = HYPRCURSOR_SIZE,24
env = PATH,$HOME/.local/bin:$PATH

# NVIDIA Wayland — required for proper GPU rendering
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia
env = NVD_BACKEND,direct


###################
### PERMISSIONS ###
###################

# See https://wiki.hypr.land/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
# permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hypr.land/Configuring/Variables/

# https://wiki.hypr.land/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 20

    border_size = 3

    # Gold to Rose gradient border - elegant shifting colors
    col.active_border = rgba(f5a623ff) rgba(e8a854ff) rgba(d4848cff) rgba(e875a1ff) 45deg
    col.inactive_border = rgba(6b8caebb)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = false

    # Please see https://wiki.hypr.land/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hypr.land/Configuring/Variables/#decoration
decoration {
    rounding = 12
    rounding_power = 2

    # Dim inactive windows (disabled - using border colors for focus indication)
    dim_inactive = false
    dim_strength = 0.15

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 15
        render_power = 3
        color = rgba(e8a85450)
        color_inactive = rgba(00000000)
        offset = 0 0
    }

    # https://wiki.hypr.land/Configuring/Variables/#blur
    # Liquid metal blur — heavy blur for deep transparency
    blur {
        enabled = true
        size = 12
        passes = 4
        new_optimizations = true
        xray = false
        noise = 0.01
        contrast = 1.1
        brightness = 0.95
        vibrancy = 0.3
        vibrancy_darkness = 0.3
        popups = true
        special = true
    }
}

# https://wiki.hypr.land/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Curves - from smooth to bouncy
    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1
    bezier = quick, 0.15, 0, 0.1, 1

    # Custom freaky curves
    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = bounce, 0.68, -0.55, 0.265, 1.55
    bezier = smoothOut, 0.36, 0, 0.66, -0.56
    bezier = smoothIn, 0.25, 1, 0.5, 1
    bezier = elastic, 0.28, 0.84, 0.42, 1

    # Window animations - bouncy pop-in effect
    animation = windows, 1, 5, bounce, slide
    animation = windowsIn, 1, 5, bounce, popin 80%
    animation = windowsOut, 1, 4, smoothOut, popin 80%
    animation = windowsMove, 1, 4, overshot, slide

    # Fading
    animation = fadeIn, 1, 3, smoothIn
    animation = fadeOut, 1, 3, smoothOut
    animation = fade, 1, 4, quick

    # Border color animation (slow elegant shift)
    animation = border, 1, 10, default
    animation = borderangle, 1, 300, linear, loop

    # Layers (popups, menus)
    animation = layers, 1, 4, elastic
    animation = layersIn, 1, 4, bounce, slide
    animation = layersOut, 1, 3, smoothOut, slide
    animation = fadeLayersIn, 1, 3, smoothIn
    animation = fadeLayersOut, 1, 3, smoothOut

    # Workspace switching - slide effect
    animation = workspaces, 1, 5, overshot, slide
    animation = workspacesIn, 1, 5, overshot, slide
    animation = workspacesOut, 1, 5, overshot, slide
    animation = specialWorkspace, 1, 5, bounce, slidevert
}

# Ref https://wiki.hypr.land/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hypr.land/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hypr.land/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hypr.land/Configuring/Variables/#misc
misc {
    force_default_wallpaper = -1 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = false # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hypr.land/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = false
    }
}

# See https://wiki.hypr.land/Configuring/Gestures
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hypr.land/Configuring/Keywords/#per-device-input-configs for more
# device[epic-mouse-v1] {
#     sensitivity = -0.5
# }


###################
### KEYBINDINGS ###
###################

# See https://wiki.hypr.land/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, escape, exec, wlogout -b 4
bind = $mainMod SHIFT CTRL, M, exit,  # emergency exit (no menu)
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, A, exec, kitty --class claude-code --title "Claude Code" -e claude
bind = $mainMod, T, exec, kitty -e btop
bind = $mainMod, V, togglefloating,
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle

# Screenshot area to clipboard + save
bind = , F9, exec, grim -g "$(slurp)" - | tee ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png | wl-copy
# Screenshot with annotation (draw arrows, text, highlights before saving)
bind = SHIFT, F9, exec, grim -g "$(slurp)" - | satty --filename - --output-filename ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png --copy-command wl-copy

# Color picker - click anywhere to copy hex color
bind = $mainMod SHIFT, C, exec, hyprpicker -a

# Clipboard history
bind = , F10, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy

# Emoji picker
bind = $mainMod, period, exec, rofimoji --action type --typer wtype

# Toggle fullscreen
bind = , F11, fullscreen, 0
bind = $mainMod, F, fullscreen, 0

# Vocalinux toggle (disabled — wrong path)
# bind = , F12, exec, /home/dori/vocalinux/toggle-vocalinux.sh

# Screenshot full screen
bind = , Print, exec, grim ~/Pictures/Screenshots/$(date +%Y%m%d_%H%M%S).png && wl-copy < ~/Pictures/Screenshots/$(ls -t ~/Pictures/Screenshots | head -1)

# Screen recording toggle (Super+Shift+V to start, again to stop)
bind = $mainMod SHIFT, V, exec, pkill wf-recorder || wf-recorder -g "$(slurp)" -f ~/Videos/recording_$(date +%Y%m%d_%H%M%S).mp4

# Reload Hyprland config
bind = $mainMod SHIFT, R, exec, hyprctl reload && notify-send "Hyprland" "Config reloaded"

# Toggle idle/sleep (hypridle) - kills or restarts the daemon
bind = $mainMod, F5, exec, pkill hypridle && notify-send "Hypridle" "Sleep disabled - staying awake" || { hypridle & notify-send "Hypridle" "Sleep re-enabled"; }

# Lock screen
bind = $mainMod, L, exec, hyprlock

# Do Not Disturb toggle
bind = $mainMod SHIFT, D, exec, ~/.config/hypr/scripts/dnd-toggle.sh

# Cycle through windows (alt-tab style)
bind = ALT, Tab, cyclenext,
bind = ALT SHIFT, Tab, cyclenext, prev

# Falco shine cursor toggle
bind = ALT, S, exec, ~/.config/hypr/scripts/shine-toggle.sh

# Center floating window
bind = $mainMod SHIFT, space, centerwindow,

# Pin window (visible on all workspaces)
bind = $mainMod SHIFT, P, pin,

# Move windows with keyboard
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Resize windows with keyboard (resize mode)
bind = $mainMod CTRL, left, resizeactive, -50 0
bind = $mainMod CTRL, right, resizeactive, 50 0
bind = $mainMod CTRL, up, resizeactive, 0 -50
bind = $mainMod CTRL, down, resizeactive, 0 50

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Scratchpad
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Dropdown terminal (quake-style) - Super + grave/tilde to toggle
bind = $mainMod, grave, exec, ~/.config/hypr/scripts/dropdown.sh

# Notification history (makoctl)
bind = $mainMod, N, exec, makoctl restore

# Wallpaper controls
bind = $mainMod, W, exec, ~/.config/hypr/scripts/wallpaper.sh picker
bind = $mainMod SHIFT, W, exec, ~/.config/hypr/scripts/wallpaper.sh random

# Browser
bind = $mainMod, B, exec, firefox

# Hyprshade screen effects
bind = $mainMod SHIFT, N, exec, hyprshade toggle blue-light-filter
bind = $mainMod CTRL, N, exec, hyprshade off

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# App launcher (alternative to Super+R)
bind = SUPER, D, exec, pkill rofi || rofi -show drun

# Show keybinds cheatsheet (Super+Shift+?)
bind = $mainMod SHIFT, slash, exec, ~/.config/hypr/scripts/show-keybinds.sh

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hypr.land/Configuring/Window-Rules/ for more
# See https://wiki.hypr.land/Configuring/Workspace-Rules/ for workspace rules

# Ignore maximize requests from apps
windowrule {
    name = suppress-maximize
    match:class = .*
    suppress_event = maximize
}

# Fix some dragging issues with XWayland
windowrule {
    name = fix-xwayland-drag
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

# my stuff
windowrule {
    name = code-workspace
    match:class = ^(code)$
    workspace = 3
}

###############################
### FREAKY WINDOW RULES ###
###############################

# Dropdown terminal - full width, 40% height, pinned to top
windowrule {
    name = dropdown-terminal
    match:class = ^(dropdown)$
    float = on
    size = 100% 40%
    move = 0 0
    animation = slidevert
    opacity = 0.85
    pin = on
}


# Kitty terminal — tiled: readable, floating: see-through glass
windowrule {
    name = kitty-opacity
    match:class = ^(kitty)$
    opacity = 0.9 0.85
}
windowrule {
    name = kitty-float-glass
    match:class = ^(kitty)$
    match:float = true
    opacity = 0.45 0.35
}

# Claude Code — slightly more opaque for readability
windowrule {
    name = claude-code-class
    match:class = ^(claude-code)$
    opacity = 0.88 0.82
}
windowrule {
    name = claude-code-title
    match:title = ^(Claude Code.*)$
    opacity = 0.88 0.82
}

# Firefox picture-in-picture
windowrule {
    name = firefox-pip
    match:title = ^(Picture-in-Picture)$
    float = on
    pin = on
    size = 400 225
}

# File picker dialogs
windowrule {
    name = file-picker-float
    match:title = ^(Open File)$|^(Save File)$|^(Open Folder)$
    float = on
}

# Make wofi/rofi popups pretty
windowrule {
    name = launcher-float
    match:class = ^(wofi)$|^(rofi)$
    animation = slide
}

# Wlogout power menu - fullscreen overlay
windowrule {
    name = wlogout-float
    match:class = ^(wlogout)$
    float = on
    fullscreen = true
}

##############################
### LAYER RULES (blur) ###
##############################

# Liquid metal — blur behind waybar, rofi, notifications
layerrule {
    name = blur-waybar
    match:namespace = waybar
    blur = true
}
layerrule {
    name = blur-rofi
    match:namespace = rofi
    blur = true
}
layerrule {
    name = blur-notifications
    match:namespace = notifications
    blur = true
}
layerrule {
    name = blur-wofi
    match:namespace = wofi
    blur = true
}

###############################
### WORKSPACE RULES ###
###############################

# Workspace 2: Extra blur + transparency (chill vibes)
workspace = 2, gapsin:8, gapsout:30

# Workspace 3: Focused coding (tighter layout)
workspace = 3, gapsin:2, gapsout:5

# Dropdown workspace slides from top
workspace = special:dropdown, gapsin:0, gapsout:0, border:false, on-created-empty:kitty --class dropdown

# (notification center removed — using makoctl restore on Super+N instead)
