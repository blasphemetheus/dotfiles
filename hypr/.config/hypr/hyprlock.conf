# Hyprlock — Gold to Rose theme with liquid metal blur

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 8
    brightness = 0.6
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# Time
label {
    monitor =
    text = $TIME
    color = rgba(e8a854ff)
    font_size = 95
    font_family = JetBrains Mono Bold
    position = 0, 200
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(00000080)
}

# Date
label {
    monitor =
    text = cmd[update:3600000] date +"%A, %B %d"
    color = rgba(e8e0d6cc)
    font_size = 22
    font_family = JetBrains Mono
    position = 0, 110
    halign = center
    valign = center
}

# Greeting
label {
    monitor =
    text = Hey, $USER
    color = rgba(e875a1ff)
    font_size = 16
    font_family = JetBrains Mono
    position = 0, -50
    halign = center
    valign = center
}

# Password input
input-field {
    monitor =
    size = 300, 50
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(e8a854ff)
    inner_color = rgba(1e1c23cc)
    font_color = rgba(e8e0d6ff)
    fade_on_empty = true
    fade_timeout = 2000
    placeholder_text = <i>Enter Password...</i>
    hide_input = false
    rounding = 15
    check_color = rgba(a8c686ff)
    fail_color = rgba(e85a5aff)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    fail_transition = 300
    capslock_color = rgba(f5a623ff)
    position = 0, -130
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(00000060)
}

# System info (bottom)
label {
    monitor =
    text = cmd[update:1000] echo "$(uname -n) • $(date +%I:%M\ %p)"
    color = rgba(6b8caebb)
    font_size = 11
    font_family = JetBrains Mono
    position = 0, 30
    halign = center
    valign = bottom
}
