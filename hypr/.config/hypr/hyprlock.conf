# Hyprlock — Gold to Rose over the current wallpaper.
#
# This is ALSO the login screen: greetd autologs into Hyprland at boot and
# hyprland.conf locks immediately (HYPR_AUTOLOGIN_LOCK, configuration.nix
# initial_session). tuigreet is only the fallback after logout. Banner and
# quote come from the same /etc/greeter files tuigreet uses.
#
# Everything on screen is fed by ~/.config/hypr/scripts/lock/*.sh — each is a
# short offline command, so the panel keeps working when WiFi is dead (the
# 2026-09-07 WCN7850 episode). cmd[update:0] = evaluated once per lock.
# `pkill -USR2 -x hyprlock` makes every label re-run (buttons use it).
#
# Power buttons act without a password — same trust level as tuigreet's
# power menu on this single-user box.

$font    = JetBrainsMono Nerd Font
$gold    = rgba(e8a854ff)
$rose    = rgba(e875a1ff)
$cream   = rgba(e8e0d6cc)
$dim     = rgba(6b8caebb)
$warn    = rgba(f5a623ff)
$scripts = ~/.config/hypr/scripts

general {
    hide_cursor = false          # buttons are clickable
    immediate_render = true      # paint before the blur finishes
    ignore_empty_input = true
    fail_timeout = 2000
}

animations {
    enabled = true
    bezier = ease, 0.25, 0.1, 0.25, 1
    animation = fadeIn, 1, 3, ease
    animation = fadeOut, 1, 3, ease
    animation = inputFieldDots, 1, 2, ease
}

# lock-wrapper.sh copies the current swww wallpaper here before launch.
background {
    monitor =
    path = ~/.cache/lock-wallpaper
    blur_passes = 3
    blur_size = 7
    brightness = 0.35
    contrast = 1.0
    vibrancy = 0.2
    vibrancy_darkness = 0.2
}

# ── Greeter parity: banner + quote ────────────────────────────────────────
label {
    monitor =
    text = cmd[update:0] $scripts/greeter-banner.sh
    text_align = left
    color = $gold
    font_size = 11
    font_family = $font
    position = 0, -30
    halign = center
    valign = top
}

label {
    monitor =
    text = cmd[update:0] $scripts/greeter-quote.sh
    text_align = center
    color = $rose
    font_size = 14
    font_family = $font Italic
    position = 0, 45
    halign = center
    valign = center
}

# "Did you know" — a random keybind from keybinds.md
label {
    monitor =
    text = cmd[update:0] $scripts/lock/tip.sh
    color = $dim
    font_size = 12
    font_family = $font
    position = 0, 5
    halign = center
    valign = center
}

# ── Clock ─────────────────────────────────────────────────────────────────
label {
    monitor =
    text = $TIME
    color = $gold
    font_size = 95
    font_family = $font Bold
    position = 0, 200
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(00000080)
}

label {
    monitor =
    text = cmd[update:60000] date +"%I:%M %p  |  %A, %B %d"
    color = $cream
    font_size = 20
    font_family = $font
    position = 0, 110
    halign = center
    valign = center
}

# ── Greeting + password ───────────────────────────────────────────────────
label {
    monitor =
    text = Hey, $USER
    color = $rose
    font_size = 16
    font_family = $font
    position = 0, -50
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 50
    outline_thickness = 3
    dots_size = 0.25
    dots_spacing = 0.3
    dots_center = true
    outer_color = $gold
    inner_color = rgba(1e1c23cc)
    font_color = rgba(e8e0d6ff)
    font_family = $font
    fade_on_empty = true
    fade_timeout = 2000
    placeholder_text = <i>Enter Password...</i>
    hide_input = false
    rounding = 15
    check_color = rgba(a8c686ff)
    fail_color = rgba(e85a5aff)
    fail_text = <i>$FAIL ($ATTEMPTS)</i>
    capslock_color = $warn
    position = 0, -130
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 4
    shadow_color = rgba(00000060)
}

# ── Top-right: notifications since lock ───────────────────────────────────
label {
    monitor =
    text = cmd[update:5000] $scripts/lock/notifs.sh
    text_align = right
    color = $warn
    font_size = 13
    font_family = $font
    position = -40, -40
    halign = right
    valign = top
}

# ── Bottom-left: health warnings, then the live system panel ─────────────
label {
    monitor =
    text = cmd[update:10000] $scripts/lock/health.sh
    text_align = left
    color = $warn
    font_size = 12
    font_family = $font
    position = 40, 190
    halign = left
    valign = bottom
}

label {
    monitor =
    text = cmd[update:3000] $scripts/lock/sysinfo.sh
    text_align = left
    color = $dim
    font_size = 11
    font_family = $font
    position = 40, 60
    halign = left
    valign = bottom
}

# ── Bottom-right: now playing + album art (file:// art only) ─────────────
image {
    monitor =
    path = ~/.cache/lock-art-blank.png
    size = 96
    rounding = 12
    border_size = 0
    reload_time = 2
    reload_cmd = $scripts/lock/nowplaying-art.sh
    position = -40, 95
    halign = right
    valign = bottom
}

label {
    monitor =
    text = cmd[update:2000] $scripts/lock/nowplaying.sh
    text_align = right
    color = $cream
    font_size = 13
    font_family = $font
    position = -40, 60
    halign = right
    valign = bottom
}

# ── Bottom-centre: buttons ────────────────────────────────────────────────
label {
    monitor =
    text = 󰤄  Suspend
    color = $cream
    font_size = 13
    font_family = $font
    onclick = systemctl suspend
    position = -330, 60
    halign = center
    valign = bottom
}
label {
    monitor =
    text = 󰜉  Reboot
    color = $cream
    font_size = 13
    font_family = $font
    onclick = systemctl reboot
    position = -190, 60
    halign = center
    valign = bottom
}
label {
    monitor =
    text = ⏻  Power off
    color = $cream
    font_size = 13
    font_family = $font
    onclick = systemctl poweroff
    position = -40, 60
    halign = center
    valign = bottom
}
label {
    monitor =
    text = cmd[update:0] $scripts/lock/btn-led.sh
    color = $cream
    font_size = 13
    font_family = $font
    onclick = $scripts/led-ctl.sh toggle; pkill -USR2 -x hyprlock
    position = 120, 60
    halign = center
    valign = bottom
}
label {
    monitor =
    text = cmd[update:0] $scripts/lock/btn-mute.sh
    color = $cream
    font_size = 13
    font_family = $font
    onclick = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle; pkill -USR2 -x hyprlock
    position = 260, 60
    halign = center
    valign = bottom
}
label {
    monitor =
    text = 󰖔  Blue light
    color = $cream
    font_size = 13
    font_family = $font
    onclick = hyprshade toggle blue-light-3500
    position = 390, 60
    halign = center
    valign = bottom
}

# ── Footer ────────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:5000] echo "$(uname -n)  •  $(date +%I:%M\ %p)  •  $(~/.config/hypr/scripts/lock-netinfo.sh)  •  Ctrl+Alt+F2 = console"
    color = $dim
    font_size = 10
    font_family = $font
    position = 0, 20
    halign = center
    valign = bottom
}
