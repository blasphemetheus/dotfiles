general {
    # Wrapper serialises concurrent launches (loginctl lock-session is
    # session-wide, so multiple hypridles race) AND respawns hyprlock when it
    # crashes on teardown, which 0.9.2 does. See the script header.
    lock_cmd = ~/.config/hypr/scripts/lock-wrapper.sh
    before_sleep_cmd = loginctl lock-session
    # dpms on + 60→165Hz bounce: the ASUS HDMI link won't train at 165Hz
    # cold after S3 resume (panel shows "no signal"), but syncs at 60 then
    # steps up fine. See scripts/hdmi-wake.sh.
    # led-ctl resume-apply re-asserts RGB state after openrgb-resume.service
    # restarts the SDK server (resume USB reset stales its device fd).
    # discord-recover resume-check restarts Discord only if it's been up >12h:
    # its renderer wedges on the splash after enough S3 cycles while the socket
    # layer stays healthy, so there's no probe for it — only uptime correlates.
    after_sleep_cmd = date +%s > ~/.local/state/hyprland/last-resume; ~/.config/hypr/scripts/led-ctl.sh resume-apply & ~/.config/hypr/scripts/discord-recover.sh resume-check & ~/.config/hypr/scripts/hdmi-wake.sh
}

# Turn off screen after 15 minutes
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Lock screen after 25 minutes
listener {
    timeout = 1500
    on-timeout = loginctl lock-session
}

# Suspend after 40 minutes
listener {
    timeout = 2400
    on-timeout = systemctl suspend
}
