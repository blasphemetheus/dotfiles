general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    # dpms on + 60→165Hz bounce: the ASUS HDMI link won't train at 165Hz
    # cold after S3 resume (panel shows "no signal"), but syncs at 60 then
    # steps up fine. See scripts/hdmi-wake.sh.
    after_sleep_cmd = ~/.config/hypr/scripts/hdmi-wake.sh
}

# Turn off screen after 15 minutes
listener {
    timeout = 900
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Lock screen after 25 minutes
listener {
    timeout = 1500
    on-timeout = loginctl lock-session
}

# Suspend after 40 minutes
listener {
    timeout = 2400
    on-timeout = systemctl suspend
}
